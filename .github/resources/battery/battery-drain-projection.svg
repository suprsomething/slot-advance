<svg xmlns="http://www.w3.org/2000/svg" width="720" height="590" viewBox="0 0 720 590" role="img" aria-labelledby="t d">
<title id="t">Battery used while asleep: about 2 to 3.2% an hour, 16 to 26% over 8 hours, from three extended sleeps on 0.4.0 and 0.4.1</title>
<desc id="d">Two dashed lines rise from 0% at 0 hours to 16% and about 26% at 8 hours, at 2 and 3.2% an hour, with the range between them shaded. Four observed points: 16% (98% to 82%) over 8 hours on 0.4.0-beta.3, 20% (94% to 74%) over 7 hours 46 minutes on 0.4.0, 24% (99% to 75%) over 7 hours 37 minutes on 0.4.1-beta.1, and 3% over 1.5 hours in an earlier experiment.</desc>
<rect x="0.5" y="0.5" width="719" height="589" rx="14" fill="#17161D" stroke="#2E2C38"/>
<g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
<text x="32" y="50" font-size="24" fill="#EEECF4" font-weight="650" text-anchor="start">Battery used while asleep</text>
<text x="32" y="80" font-size="16" fill="#C2BFD0" font-weight="400" text-anchor="start">About 2 to 3.2% an hour, as three extended sleeps showed (0.4.0 and 0.4.1)</text>
<line x1="84" y1="420.0" x2="680" y2="420.0" stroke="#2E2C38"/>
<text x="72" y="425.0" font-size="14" fill="#A3A0B3" font-weight="400" text-anchor="end">0%</text>
<line x1="84" y1="370.0" x2="680" y2="370.0" stroke="#2E2C38"/>
<text x="72" y="375.0" font-size="14" fill="#A3A0B3" font-weight="400" text-anchor="end">5%</text>
<line x1="84" y1="320.0" x2="680" y2="320.0" stroke="#2E2C38"/>
<text x="72" y="325.0" font-size="14" fill="#A3A0B3" font-weight="400" text-anchor="end">10%</text>
<line x1="84" y1="270.0" x2="680" y2="270.0" stroke="#2E2C38"/>
<text x="72" y="275.0" font-size="14" fill="#A3A0B3" font-weight="400" text-anchor="end">15%</text>
<line x1="84" y1="220.0" x2="680" y2="220.0" stroke="#2E2C38"/>
<text x="72" y="225.0" font-size="14" fill="#A3A0B3" font-weight="400" text-anchor="end">20%</text>
<line x1="84" y1="170.0" x2="680" y2="170.0" stroke="#2E2C38"/>
<text x="72" y="175.0" font-size="14" fill="#A3A0B3" font-weight="400" text-anchor="end">25%</text>
<line x1="84" y1="120.0" x2="680" y2="120.0" stroke="#2E2C38"/>
<text x="72" y="125.0" font-size="14" fill="#A3A0B3" font-weight="400" text-anchor="end">30%</text>
<text x="84.0" y="446" font-size="14" fill="#A3A0B3" font-weight="400" text-anchor="middle">0</text>
<text x="158.5" y="446" font-size="14" fill="#A3A0B3" font-weight="400" text-anchor="middle">1</text>
<text x="233.0" y="446" font-size="14" fill="#A3A0B3" font-weight="400" text-anchor="middle">2</text>
<text x="307.5" y="446" font-size="14" fill="#A3A0B3" font-weight="400" text-anchor="middle">3</text>
<text x="382.0" y="446" font-size="14" fill="#A3A0B3" font-weight="400" text-anchor="middle">4</text>
<text x="456.5" y="446" font-size="14" fill="#A3A0B3" font-weight="400" text-anchor="middle">5</text>
<text x="531.0" y="446" font-size="14" fill="#A3A0B3" font-weight="400" text-anchor="middle">6</text>
<text x="605.5" y="446" font-size="14" fill="#A3A0B3" font-weight="400" text-anchor="middle">7</text>
<text x="680.0" y="446" font-size="14" fill="#A3A0B3" font-weight="400" text-anchor="middle">8</text>
<text x="382.0" y="472" font-size="15" fill="#C2BFD0" font-weight="400" text-anchor="middle">Hours asleep</text>
<text x="26" y="270.0" font-size="15" fill="#C2BFD0" font-weight="400" text-anchor="middle" transform="rotate(-90 26 270.0)">Battery used</text>
<path d="M84.0 420.0 L680.0 164.0 L680.0 260.0 Z" fill="#8B7CF6" opacity="0.18"/>
<line x1="84.0" y1="420.0" x2="680.0" y2="260.0" stroke="#8B7CF6" stroke-width="2" stroke-dasharray="8 6"/>
<line x1="84.0" y1="420.0" x2="680.0" y2="164.0" stroke="#8B7CF6" stroke-width="2" stroke-dasharray="8 6"/>
<text x="223.0" y="344.0" font-size="15" fill="#EEECF4" font-weight="600" text-anchor="end">2 hr: 4 to 6.4%</text>
<text x="372.0" y="280.0" font-size="15" fill="#EEECF4" font-weight="600" text-anchor="end">4 hr: 8 to 12.8%</text>
<rect x="417.8" y="169.0" width="223.6" height="22" rx="4" fill="#17161D" opacity="0.88"/>
<text x="637.4416666666666" y="185.0" font-size="15" fill="#EEECF4" font-weight="600" text-anchor="end">24% in 7.6 hr (0.4.1-beta.1)</text>
<circle cx="651.4" cy="180.0" r="7" fill="#EEECF4"/>
<rect x="483.5" y="209.0" width="169.7" height="22" rx="4" fill="#17161D" opacity="0.88"/>
<text x="649.1754166666667" y="225.0" font-size="15" fill="#EEECF4" font-weight="600" text-anchor="end">20% in 7.8 hr (0.4.0)</text>
<circle cx="663.2" cy="220.0" r="7" fill="#EEECF4"/>
<rect x="461.8" y="249.0" width="208.2" height="22" rx="4" fill="#17161D" opacity="0.88"/>
<text x="666.0" y="265.0" font-size="15" fill="#EEECF4" font-weight="600" text-anchor="end">16% in 8 hr (0.4.0-beta.3)</text>
<circle cx="680.0" cy="260.0" r="7" fill="#EEECF4"/>
<circle cx="195.8" cy="390.0" r="7" fill="#EEECF4"/>
<text x="209.75" y="416.0" font-size="14" fill="#EEECF4" font-weight="600" text-anchor="start">3% in 1.5 hr (Experiment 5)</text>
<rect x="424" y="352" width="262" height="62" rx="8" fill="#17161D" opacity="0.9"/>
<line x1="430" y1="366" x2="458" y2="366" stroke="#8B7CF6" stroke-width="2" stroke-dasharray="8 6"/>
<text x="468" y="371" font-size="14" fill="#C2BFD0" font-weight="400" text-anchor="start">Projected at 2 and 3.2% an hour</text>
<circle cx="444" cy="386" r="6" fill="#EEECF4"/>
<text x="468" y="391" font-size="14" fill="#C2BFD0" font-weight="400" text-anchor="start">Observed</text>
<text x="32" y="512" font-size="16" fill="#A3A0B3" font-weight="400" text-anchor="start">The three extended sleeps set the range; it is what the gauge showed, not a</text>
<text x="32" y="536" font-size="16" fill="#A3A0B3" font-weight="400" text-anchor="start">guaranteed range. The gauge's 1% steps differ in size, so the rate depends partly</text>
<text x="32" y="560" font-size="16" fill="#A3A0B3" font-weight="400" text-anchor="start">on the charge level. Real use also varies with battery age and temperature.</text>
</g>
</svg>
