<svg xmlns="http://www.w3.org/2000/svg" width="720" height="590" viewBox="0 0 720 590" role="img" aria-labelledby="t d">
<title id="t">Battery used while asleep on 0.4.0: about 2 to 2.6% an hour, 16 to 21% over 8 hours, from two overnight sleeps</title>
<desc id="d">Two dashed lines rise from 0% at 0 hours to 16% and about 21% at 8 hours, at 2 and 2.6% an hour, with the range between them shaded. Three observed points: 16% (98% to 82%) over an 8-hour overnight sleep on 0.4.0-beta.3, 20% (94% to 74%) over 7 hours 46 minutes on 0.4.0, and 3% over 1.5 hours in an earlier experiment.</desc>
<rect x="0.5" y="0.5" width="719" height="589" rx="14" fill="#17161D" stroke="#2E2C38"/>
<g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
<text x="32" y="50" font-size="24" fill="#EEECF4" font-weight="650" text-anchor="start">Battery used while asleep</text>
<text x="32" y="80" font-size="16" fill="#C2BFD0" font-weight="400" text-anchor="start">0.4.0 at about 2 to 2.6% an hour, as two overnight sleeps showed</text>
<line x1="84" y1="420.0" x2="680" y2="420.0" stroke="#2E2C38"/>
<text x="72" y="425.0" font-size="14" fill="#A3A0B3" font-weight="400" text-anchor="end">0%</text>
<line x1="84" y1="360.0" x2="680" y2="360.0" stroke="#2E2C38"/>
<text x="72" y="365.0" font-size="14" fill="#A3A0B3" font-weight="400" text-anchor="end">5%</text>
<line x1="84" y1="300.0" x2="680" y2="300.0" stroke="#2E2C38"/>
<text x="72" y="305.0" font-size="14" fill="#A3A0B3" font-weight="400" text-anchor="end">10%</text>
<line x1="84" y1="240.0" x2="680" y2="240.0" stroke="#2E2C38"/>
<text x="72" y="245.0" font-size="14" fill="#A3A0B3" font-weight="400" text-anchor="end">15%</text>
<line x1="84" y1="180.0" x2="680" y2="180.0" stroke="#2E2C38"/>
<text x="72" y="185.0" font-size="14" fill="#A3A0B3" font-weight="400" text-anchor="end">20%</text>
<line x1="84" y1="120.0" x2="680" y2="120.0" stroke="#2E2C38"/>
<text x="72" y="125.0" font-size="14" fill="#A3A0B3" font-weight="400" text-anchor="end">25%</text>
<text x="84.0" y="446" font-size="14" fill="#A3A0B3" font-weight="400" text-anchor="middle">0</text>
<text x="158.5" y="446" font-size="14" fill="#A3A0B3" font-weight="400" text-anchor="middle">1</text>
<text x="233.0" y="446" font-size="14" fill="#A3A0B3" font-weight="400" text-anchor="middle">2</text>
<text x="307.5" y="446" font-size="14" fill="#A3A0B3" font-weight="400" text-anchor="middle">3</text>
<text x="382.0" y="446" font-size="14" fill="#A3A0B3" font-weight="400" text-anchor="middle">4</text>
<text x="456.5" y="446" font-size="14" fill="#A3A0B3" font-weight="400" text-anchor="middle">5</text>
<text x="531.0" y="446" font-size="14" fill="#A3A0B3" font-weight="400" text-anchor="middle">6</text>
<text x="605.5" y="446" font-size="14" fill="#A3A0B3" font-weight="400" text-anchor="middle">7</text>
<text x="680.0" y="446" font-size="14" fill="#A3A0B3" font-weight="400" text-anchor="middle">8</text>
<text x="382.0" y="472" font-size="15" fill="#C2BFD0" font-weight="400" text-anchor="middle">Hours asleep</text>
<text x="26" y="270.0" font-size="15" fill="#C2BFD0" font-weight="400" text-anchor="middle" transform="rotate(-90 26 270.0)">Battery used</text>
<path d="M84.0 420.0 L680.0 170.4 L680.0 228.0 Z" fill="#8B7CF6" opacity="0.18"/>
<line x1="84.0" y1="420.0" x2="680.0" y2="228.0" stroke="#8B7CF6" stroke-width="2" stroke-dasharray="8 6"/>
<line x1="84.0" y1="420.0" x2="680.0" y2="170.4" stroke="#8B7CF6" stroke-width="2" stroke-dasharray="8 6"/>
<text x="223.0" y="345.6" font-size="15" fill="#EEECF4" font-weight="600" text-anchor="end">2 hr: 4 to 5.2%</text>
<text x="372.0" y="283.2" font-size="15" fill="#EEECF4" font-weight="600" text-anchor="end">4 hr: 8 to 10.4%</text>
<circle cx="680.0" cy="228.0" r="7" fill="#EEECF4"/>
<text x="668.0" y="254.0" font-size="15" fill="#EEECF4" font-weight="600" text-anchor="end">Observed: 16% in 8 hr (beta.3)</text>
<circle cx="663.2" cy="180.0" r="7" fill="#EEECF4"/>
<text x="651.1754166666667" y="166.0" font-size="15" fill="#EEECF4" font-weight="600" text-anchor="end">Observed: 20% in 7.8 hr (0.4.0)</text>
<circle cx="195.8" cy="384.0" r="7" fill="#EEECF4"/>
<text x="209.75" y="410.0" font-size="14" fill="#EEECF4" font-weight="600" text-anchor="start">Observed: 3% in 1.5 hr</text>
<rect x="394" y="330" width="290" height="62" rx="8" fill="#17161D" opacity="0.9"/>
<line x1="400" y1="344" x2="428" y2="344" stroke="#8B7CF6" stroke-width="2" stroke-dasharray="8 6"/>
<text x="438" y="349" font-size="14" fill="#C2BFD0" font-weight="400" text-anchor="start">Projected at 2 and 2.6% an hour</text>
<circle cx="414" cy="364" r="6" fill="#EEECF4"/>
<text x="438" y="369" font-size="14" fill="#C2BFD0" font-weight="400" text-anchor="start">Measured</text>
<text x="32" y="512" font-size="16" fill="#A3A0B3" font-weight="400" text-anchor="start">The two overnight sleeps set the range. The gauge's 1% steps differ in size, so the</text>
<text x="32" y="536" font-size="16" fill="#A3A0B3" font-weight="400" text-anchor="start">rate shown depends partly on the charge level. Real use also varies with battery age</text>
<text x="32" y="560" font-size="16" fill="#A3A0B3" font-weight="400" text-anchor="start">and temperature. It only sleeps this long if Settings &gt; Sleep is set long enough.</text>
</g>
</svg>
