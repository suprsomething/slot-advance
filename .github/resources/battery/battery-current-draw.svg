<svg xmlns="http://www.w3.org/2000/svg" width="720" height="566" viewBox="0 0 720 566" role="img" aria-labelledby="t d">
<title id="t">Estimated lid-closed current draw: about 250 mA for 0.3.0 software standby, 105 mA for the first suspend-to-RAM test, 70 mA for the 0.4.0 configuration</title>
<desc id="d">Horizontal bar chart of currents calculated from battery-gauge readings. 0.3.0 software standby, a test build held awake: about 250 mA (248 to 253). First suspend-to-RAM with USB and Wi-Fi on: about 105 mA (87.5 to 122.5). 0.4.0 configuration with USB and Wi-Fi off, reproduced in a development experiment: about 70 mA, with an illustrative range of 60 to 80 mA. About 72% less than software standby.</desc>
<rect x="0.5" y="0.5" width="719" height="565" rx="14" fill="#17161D" stroke="#2E2C38"/>
<g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
<text x="32" y="50" font-size="24" fill="#EEECF4" font-weight="650" text-anchor="start">Estimated lid-closed current draw</text>
<text x="32" y="80" font-size="16" fill="#C2BFD0" font-weight="400" text-anchor="start">Calculated from battery-gauge readings, not measured with test equipment</text>
<line x1="32.0" y1="104" x2="32.0" y2="400" stroke="#2E2C38" stroke-width="1"/>
<text x="32.0" y="424" font-size="14" fill="#A3A0B3" font-weight="400" text-anchor="start">0 mA</text>
<line x1="234.9" y1="104" x2="234.9" y2="400" stroke="#2E2C38" stroke-width="1"/>
<text x="234.85714285714283" y="424" font-size="14" fill="#A3A0B3" font-weight="400" text-anchor="middle">100 mA</text>
<line x1="437.7" y1="104" x2="437.7" y2="400" stroke="#2E2C38" stroke-width="1"/>
<text x="437.71428571428567" y="424" font-size="14" fill="#A3A0B3" font-weight="400" text-anchor="middle">200 mA</text>
<text x="32" y="132" font-size="18" fill="#EEECF4" font-weight="600">0.3.0 software standby<tspan dx="10" font-size="15" font-weight="400" fill="#A3A0B3">test build held awake</tspan></text>
<rect x="32" y="146" width="507.1" height="30" rx="4" fill="#5C596C"/>
<path d="M535.1 161H545.2M535.1 154V168M545.2 154V168" stroke="#C2BFD0" stroke-width="1.5" fill="none" opacity="0.85"/>
<text x="557.2285714285714" y="167" font-size="18" fill="#EEECF4" font-weight="650" text-anchor="start">~250 mA</text>
<text x="32" y="228" font-size="18" fill="#EEECF4" font-weight="600">First suspend-to-RAM<tspan dx="10" font-size="15" font-weight="400" fill="#A3A0B3">USB and Wi-Fi on</tspan></text>
<rect x="32" y="242" width="213.0" height="30" rx="4" fill="#7A7690"/>
<path d="M209.5 257H280.5M209.5 250V264M280.5 250V264" stroke="#C2BFD0" stroke-width="1.5" fill="none" opacity="0.85"/>
<text x="292.5" y="263" font-size="18" fill="#EEECF4" font-weight="650" text-anchor="start">~105 mA</text>
<text x="32" y="324" font-size="18" fill="#EEECF4" font-weight="600">0.4.0 configuration<tspan dx="10" font-size="15" font-weight="400" fill="#A3A0B3">USB and Wi-Fi off</tspan></text>
<rect x="32" y="338" width="142.0" height="30" rx="4" fill="#8B7CF6"/>
<path d="M152.7 353H195.3M152.7 346V360M195.3 346V360" stroke="#C2BFD0" stroke-width="1.5" fill="none" opacity="0.85"/>
<text x="207.29999999999998" y="359" font-size="18" fill="#EEECF4" font-weight="650" text-anchor="start">~70 mA</text>
<rect x="452" y="290" width="236" height="90" rx="10" fill="#221F33" stroke="#8B7CF6" stroke-width="1.5"/>
<text x="570" y="336" font-size="30" fill="#EEECF4" font-weight="750" text-anchor="middle">~72% less</text>
<text x="570" y="362" font-size="15" fill="#C2BFD0" font-weight="400" text-anchor="middle">than software standby</text>
<text x="32" y="458" font-size="16" fill="#A3A0B3" font-weight="400" text-anchor="start">Whiskers: the gauge's resolution for 0.3.0 and the first test; for 0.4.0, an</text>
<text x="32" y="482" font-size="16" fill="#A3A0B3" font-weight="400" text-anchor="start">illustrative +/-15% range around the estimate. One development run each.</text>
<text x="32" y="506" font-size="16" fill="#A3A0B3" font-weight="400" text-anchor="start">0.4.0's settings were reproduced in an experiment; the release build itself</text>
<text x="32" y="530" font-size="16" fill="#A3A0B3" font-weight="400" text-anchor="start">has not had a battery test yet.</text>
</g>
</svg>
