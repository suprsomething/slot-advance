<svg xmlns="http://www.w3.org/2000/svg" width="720" height="566" viewBox="0 0 720 566" role="img" aria-labelledby="t d">
<title id="t">Battery used per hour with the lid closed: about 7% for 0.3.0 software standby, 3% for the first suspend-to-RAM test, 2 to 3.2% for 0.4.0 and 0.4.1</title>
<desc id="d">Blocks of 1 percent, from observed battery-gauge drops. 0.3.0 software standby (a test build held awake; ordinary 0.3.0 shuts down after 3 minutes): 61% to 47% in 2 hours, about 7% an hour. First suspend-to-RAM test: 68% to 62% in 2 hours, about 3% an hour. 0.4.0 and 0.4.1, three extended sleeps: 98% to 82% in 8 hours on 0.4.0-beta.3 (about 2% an hour), 94% to 74% in 7 h 46 min on 0.4.0 (about 2.6% an hour) and 99% to 75% in 7 h 37 min on 0.4.1-beta.1 (about 3.2% an hour). The gauge's 1% steps differ in size, so the rate shown depends partly on the charge level.</desc>
<rect x="0.5" y="0.5" width="719" height="565" rx="14" fill="#17161D" stroke="#2E2C38"/>
<g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
<text x="32" y="50" font-size="24" fill="#EEECF4" font-weight="650" text-anchor="start">Battery used per hour, lid closed</text>
<text x="32" y="80" font-size="16" fill="#C2BFD0" font-weight="400" text-anchor="start">Each block is 1% of the battery, as shown by the battery gauge</text>
<text x="32" y="136" font-size="18" fill="#EEECF4" font-weight="600">0.3.0 software standby<tspan dx="10" font-size="15" font-weight="400" fill="#A3A0B3">test build held awake</tspan></text>
<rect x="32" y="150" width="46" height="34" rx="4" fill="#5C596C"/>
<rect x="86" y="150" width="46" height="34" rx="4" fill="#5C596C"/>
<rect x="140" y="150" width="46" height="34" rx="4" fill="#5C596C"/>
<rect x="194" y="150" width="46" height="34" rx="4" fill="#5C596C"/>
<rect x="248" y="150" width="46" height="34" rx="4" fill="#5C596C"/>
<rect x="302" y="150" width="46" height="34" rx="4" fill="#5C596C"/>
<rect x="356" y="150" width="46" height="34" rx="4" fill="#5C596C"/>
<text x="416" y="175" font-size="18" fill="#EEECF4" font-weight="650" text-anchor="start">~7% an hour</text>
<text x="688" y="136" font-size="15" fill="#A3A0B3" font-weight="400" text-anchor="end">61% to 47% in 2 hours</text>
<text x="32" y="236" font-size="18" fill="#EEECF4" font-weight="600">First suspend-to-RAM<tspan dx="10" font-size="15" font-weight="400" fill="#A3A0B3">development test</tspan></text>
<rect x="32" y="250" width="46" height="34" rx="4" fill="#7A7690"/>
<rect x="86" y="250" width="46" height="34" rx="4" fill="#7A7690"/>
<rect x="140" y="250" width="46" height="34" rx="4" fill="#7A7690"/>
<text x="200" y="275" font-size="18" fill="#EEECF4" font-weight="650" text-anchor="start">~3% an hour</text>
<text x="688" y="236" font-size="15" fill="#A3A0B3" font-weight="400" text-anchor="end">68% to 62% in 2 hours</text>
<text x="32" y="336" font-size="18" fill="#EEECF4" font-weight="600">0.4.0 and 0.4.1<tspan dx="10" font-size="15" font-weight="400" fill="#A3A0B3">three extended sleeps</tspan></text>
<rect x="32" y="350" width="46" height="34" rx="4" fill="#8B7CF6"/>
<rect x="86" y="350" width="46" height="34" rx="4" fill="#8B7CF6"/>
<rect x="140.75" y="350.75" width="44.5" height="32.5" rx="4" fill="none" stroke="#8B7CF6" stroke-width="1.5"/>
<rect x="140" y="350" width="46.0" height="34" rx="4" fill="#8B7CF6" opacity="0.45"/>
<rect x="194.75" y="350.75" width="44.5" height="32.5" rx="4" fill="none" stroke="#8B7CF6" stroke-width="1.5"/>
<rect x="194" y="350" width="9.2" height="34" rx="4" fill="#8B7CF6" opacity="0.45"/>
<text x="254" y="375" font-size="18" fill="#EEECF4" font-weight="650" text-anchor="start">~2 to 3.2% an hour</text>
<text x="688" y="336" font-size="15" fill="#A3A0B3" font-weight="400" text-anchor="end">16% in 8 h, 20% in 7.8 h, 24% in 7.6 h</text>
<text x="32" y="434" font-size="16" fill="#A3A0B3" font-weight="400" text-anchor="start">Observed battery-percentage drops (whole 1% steps). Ordinary 0.3.0 shuts down</text>
<text x="32" y="458" font-size="16" fill="#A3A0B3" font-weight="400" text-anchor="start">3 minutes after the lid closes; its rate comes from a test build held in standby.</text>
<text x="32" y="482" font-size="16" fill="#A3A0B3" font-weight="400" text-anchor="start">Extended sleeps: 0.4.0-beta.3 (about 2% an hour), 0.4.0 (2.6%) and 0.4.1-beta.1</text>
<text x="32" y="506" font-size="16" fill="#A3A0B3" font-weight="400" text-anchor="start">(3.2%, from 99%). The gauge's 1% steps differ in size, so the rate shown depends</text>
<text x="32" y="530" font-size="16" fill="#A3A0B3" font-weight="400" text-anchor="start">partly on the charge level. These are observations, not a guaranteed range.</text>
</g>
</svg>
