<svg xmlns="http://www.w3.org/2000/svg" width="720" height="476" viewBox="0 0 720 476" role="img" aria-labelledby="t d">
<title id="t">Battery used per hour with the lid closed: about 7, 3 and 2 percent</title>
<desc id="d">Blocks of 1 percent. v3 software standby about 7 percent an hour, first suspend-to-RAM about 3 percent, 0.4.0 configuration about 2 percent.</desc>
<rect x="0.5" y="0.5" width="719" height="475" rx="14" fill="#17161D" stroke="#2E2C38"/>
<g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
<text x="32" y="50" font-size="24" fill="#EEECF4" font-weight="650" text-anchor="start">Battery used per hour, lid closed</text>
<text x="32" y="80" font-size="16" fill="#B4B1C2" font-weight="400" text-anchor="start">Each block is 1% of the battery, as shown by the battery gauge</text>
<text x="32" y="136" font-size="18" fill="#EEECF4" font-weight="600" text-anchor="start">v3 software standby</text>
<text x="688" y="136" font-size="14" fill="#8A8799" font-weight="400" text-anchor="end">61% to 47% in 2 hours</text>
<rect x="32" y="150" width="46" height="34" rx="4" fill="#5C596C"/>
<rect x="86" y="150" width="46" height="34" rx="4" fill="#5C596C"/>
<rect x="140" y="150" width="46" height="34" rx="4" fill="#5C596C"/>
<rect x="194" y="150" width="46" height="34" rx="4" fill="#5C596C"/>
<rect x="248" y="150" width="46" height="34" rx="4" fill="#5C596C"/>
<rect x="302" y="150" width="46" height="34" rx="4" fill="#5C596C"/>
<rect x="356" y="150" width="46" height="34" rx="4" fill="#5C596C"/>
<text x="416" y="175" font-size="18" fill="#EEECF4" font-weight="650" text-anchor="start">~7% an hour</text>
<text x="32" y="236" font-size="18" fill="#EEECF4" font-weight="600" text-anchor="start">First suspend-to-RAM</text>
<text x="688" y="236" font-size="14" fill="#8A8799" font-weight="400" text-anchor="end">68% to 62% in 2 hours</text>
<rect x="32" y="250" width="46" height="34" rx="4" fill="#7A7690"/>
<rect x="86" y="250" width="46" height="34" rx="4" fill="#7A7690"/>
<rect x="140" y="250" width="46" height="34" rx="4" fill="#7A7690"/>
<text x="200" y="275" font-size="18" fill="#EEECF4" font-weight="650" text-anchor="start">~3% an hour</text>
<text x="32" y="336" font-size="18" fill="#EEECF4" font-weight="600" text-anchor="start">0.4.0 configuration</text>
<text x="688" y="336" font-size="14" fill="#8A8799" font-weight="400" text-anchor="end">77% to 74% in 1.5 hours</text>
<rect x="32" y="350" width="46" height="34" rx="4" fill="#8B7CF6"/>
<rect x="86" y="350" width="46" height="34" rx="4" fill="#8B7CF6"/>
<text x="146" y="375" font-size="18" fill="#EEECF4" font-weight="650" text-anchor="start">~2% an hour</text>
<text x="32" y="432" font-size="13" fill="#8A8799" font-weight="400" text-anchor="start">Observed drops in the battery percentage during development tests (whole 1% steps).</text>
<text x="32" y="452" font-size="13" fill="#8A8799" font-weight="400" text-anchor="start">v3 normally powers off after 3 minutes; its hourly rate comes from a test build that stayed in standby.</text>
</g>
</svg>
